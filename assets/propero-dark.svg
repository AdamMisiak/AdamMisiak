<svg xmlns="http://www.w3.org/2000/svg" width="480" height="170" viewBox="0 0 480 170" role="img" aria-labelledby="t">
<title id="t">Propero, direct booking</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#180f0a"/><stop offset="1" stop-color="#1c0f17"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".14"/><stop offset="1" stop-color="#fff" stop-opacity=".05"/></linearGradient>
<filter id="b" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
<clipPath id="c"><rect width="480" height="170" rx="28"/></clipPath>
</defs>
<g clip-path="url(#c)">
<rect width="480" height="170" fill="url(#bg)"/>
<circle cx="90" cy="40" r="70" fill="#ff8a1f" opacity=".45" filter="url(#b)"/>
<circle cx="420" cy="150" r="80" fill="#ff3d7f" opacity=".4" filter="url(#b)"/>
</g>
<rect x="20" y="20" width="440" height="130" rx="22" fill="url(#glass)" stroke="#fff" stroke-opacity=".18" stroke-width="1.5"/>
<text x="48" y="62" font-family="-apple-system,'SF Pro Text','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="1.5" fill="#a1a1a6">CURRENTLY BUILDING</text>
<text x="48" y="104" font-family="-apple-system,'SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="36" font-weight="600" letter-spacing="-1" fill="#f5f5f7">Propero</text>
<text x="48" y="130" font-family="-apple-system,'SF Pro Text','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#a1a1a6">Direct booking</text>
<text x="420" y="104" text-anchor="end" font-family="-apple-system,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="30" fill="#f5f5f7" opacity=".5">↗</text>
