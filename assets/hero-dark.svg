<text x="500" y="125" text-anchor="middle" font-family="-apple-system,'SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="54" font-weight="600" letter-spacing="-1.5" fill="#f5f5f7">Hey, I'm Adam</text>
<text x="500" y="172" text-anchor="middle" font-family="-apple-system,'SF Pro Text','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" fill="#a1a1a6">Building products with Python, cloud and AI.</text>
